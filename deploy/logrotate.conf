# Decision logs are a deliverable: rotate daily, keep everything, compress old days.
# No copytruncate (it can drop lines written mid-rotation): the engine reopens the file on every
# append, so a plain rename + new file is safe.
/opt/wallex-agent/run/*/logs/*.jsonl {
    daily
    rotate 30
    missingok
    notifempty
    compress
    delaycompress
    create 0640 trader trader
    su trader trader
}
